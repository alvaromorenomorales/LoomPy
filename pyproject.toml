[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loompy-translator"
version = "1.0.1"
description = "A professional command-line tool that translates JSON files between multiple languages while preserving structure, keys, and placeholders."
readme = "README.md"
authors = [
  { name = "Alvaro Moreno Morales", email = "" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.0.53",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://github.com/alvaromorenomorales/LoomPy"
"Bug Tracker" = "https://github.com/alvaromorenomorales/LoomPy/issues"

[tool.setuptools]
packages = ["src"]
